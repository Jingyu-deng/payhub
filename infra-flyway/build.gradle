// infra-flyway :: Database schema migrations.
//
// Run via Gradle:
//   ./gradlew :infra-flyway:migrate
//   ./gradlew :infra-flyway:flywayInfo
//   ./gradlew :infra-flyway:flywayClean
//   ./gradlew :infra-flyway:flywayBaseline
//
// Connection config in src/main/resources/flyway.conf.
// Env vars FLYWAY_* (or ENV_DATASOURCE_*) override the conf file.
// SQL files live in src/main/resources/db/.
//
// NOTE: This module runs Flyway standalone via FlywayRunner.java — it is NOT
// on payment-platform's classpath, so Spring Boot FlywayAutoConfiguration
// does not trigger. This avoids version conflicts: Spring Boot 3.3.4's
// auto-config targets Flyway 10.x (which has JDK 21 JPMS issues), while
// Flyway 12.x removed cleanOnValidationError() that Spring Boot calls.

dependencies {
    // Flyway 11.4.x — works with JDK 21, avoids Flyway 12.x Jackson shading bug
    implementation 'org.flywaydb:flyway-core:11.4.1'
    implementation 'org.flywaydb:flyway-database-postgresql:11.4.1'
    implementation 'org.postgresql:postgresql:42.7.5'
}

def flywayTask(String command) {
    tasks.register(command == 'migrate' ? command : "flyway${command.capitalize()}", JavaExec) {
        group       = 'Flyway'
        description = "Flyway ${command}"
        classpath   = sourceSets.main.runtimeClasspath
        mainClass   = 'com.payhub.infra.flyway.FlywayRunner'
        args        = [command]
    }
}

flywayTask('migrate')
flywayTask('clean')
flywayTask('info')
flywayTask('baseline')
