// core-entities :: Domain models, value objects, domain events,
// domain exceptions, SPI contract, and JPA entities.
// Depends only on Jakarta Persistence API (standard spec, no framework).

apply plugin: 'java-library'

dependencies {
    // Versions managed by Spring Boot BOM (io.spring.dependency-management)
    implementation 'org.slf4j:slf4j-api'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// No Spring Boot — plain jar only
