// core-applications :: Concrete template bridge (CreatePaymentControl).
// Depends only on core-entities (ports/interfaces) — no framework deps.

dependencies {
    // Versions managed by Spring Boot BOM (io.spring.dependency-management)
    implementation project(':core-entities')
    implementation 'org.slf4j:slf4j-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// No Spring Boot — plain jar only
