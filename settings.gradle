rootProject.name = 'payhub'

// === Hexagonal architecture modules ===
include 'core-entities'          // Domain models, ports/interfaces (zero deps)
include 'core-applications'      // Application templates (depends on core-entities)
include 'alipay-adapter'         // Alipay impl (depends on core-entities)
include 'wechatpay-adapter'      // WeChat Pay impl (depends on core-entities)
include 'infra-http-client'      // OkHttp adapter (depends on core-entities)
include 'infra-message-client'   // Kafka event publisher (depends on core-entities)
include 'infra-database-client'  // DatabaseClient port implementation (depends on core-entities)
include 'infra-idempotent-client' // IdempotencyClient port implementation (depends on core-entities)
include 'infra-common'           // Shared Spring utilities for infra modules
include 'infra-scheduler'        // SchedulerClient port implementation (depends on core-entities)
include 'infra-runtime'          // SPI-driven template wiring (depends on core-entities)
include 'payment-platform'       // Composition root (depends on all)
