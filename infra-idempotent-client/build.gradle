// infra-idempotent-client :: IdempotencyClient port implementation.
// Provides idempotency and distributed-lock adapters (in-memory for dev, Redis for production).

apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':core-entities')
    implementation 'org.springframework.boot:spring-boot-starter'
}

bootJar.enabled = false
jar.enabled = true
