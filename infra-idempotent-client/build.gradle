// infra-idempotent-client :: IdempotencyClient port implementation.
// Provides idempotency and distributed-lock adapters (in-memory for dev, Redis for production).

apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':infra-common')
    implementation 'org.redisson:redisson-spring-boot-starter:3.37.0'
}

bootJar.enabled = false
jar.enabled = true
