plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

// Override Spring Boot BOM managed versions
ext['flyway.version'] = '11.4.1'

allprojects {
    group = 'com.payhub'
    version = '1.0.0'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    spotless {
        java {
            googleJavaFormat('1.17.0')
            target 'src/**/*.java'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

}

// Modules that can use framework dependencies (everything except core adapters and infra-flyway)
configure(subprojects.findAll { !(it.name in ['core-entities', 'core-applications', 'alipay-adapter', 'wechatpay-adapter', 'infra-flyway']) }) {
    dependencies {
        implementation 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}
