// alipay-adapter :: Alipay PaymentAdapter implementation.
// Depends ONLY on core-entities — never on infra or Spring.

dependencies {
    // Versions managed by Spring Boot BOM (io.spring.dependency-management)
    implementation project(':core-entities')
    implementation 'org.slf4j:slf4j-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

// No Spring Boot — plain jar only
