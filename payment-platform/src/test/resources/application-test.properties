# Disable infrastructure that requires external services during test
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.redisson.spring.starter.RedissonAutoConfigurationV2,\
  org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration

# H2 in PostgreSQL compatibility mode (replaces Testcontainers PostgreSQL)
spring.datasource.url=jdbc:h2:mem:payhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
