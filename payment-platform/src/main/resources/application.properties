# ── Intermediate placeholders — K8s injects ENV_*, local dev uses defaults ──

# Profile
env_active=${ENV_ACTIVE:local}

# Redis
env_redis_host=${ENV_REDIS_HOST:localhost}
env_redis_port=${ENV_REDIS_PORT:6379}
env_redis_password=${ENV_REDIS_PASSWORD:}
env_redis_idempotency_ttl=${ENV_REDIS_IDEMPOTENCY_TTL:86400}

# Kafka
env_kafka_bootstrap_servers=${ENV_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Encryption
env_encryption_key=${ENV_ENCRYPTION_KEY:cGF5aHViLWFlcy0yNTYtZ2NtLWtleS0zMmJ5dGVzISE=}

# Monitor
env_monitor_otlp_endpoint=${ENV_MONITOR_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Datasource
env_datasource_url=${ENV_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payhub}
env_datasource_username=${ENV_DATASOURCE_USERNAME:payhub}
env_datasource_password=${ENV_DATASOURCE_PASSWORD:payhub123}
