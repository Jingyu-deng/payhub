server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ── K8s health probes ──────────────────────────────────────────
# Expose liveness/readiness at /actuator/health/liveness and .../readiness
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never   # hide from public; use auth if exposed via ingress
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
