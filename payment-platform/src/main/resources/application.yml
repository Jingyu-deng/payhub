server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-platform
  profiles:
    active: ${env_active}
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ── K8s health probes ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
