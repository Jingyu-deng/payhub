# ── Management endpoints, metrics, tracing ─────────────────────

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    group:
      readiness:
        include: db, redis, kafka, Database
      liveness:
        include: diskSpace, ping
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${env_monitor_otlp_endpoint}
      transport: http
